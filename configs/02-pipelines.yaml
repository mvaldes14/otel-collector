# 02 — the everyday shape: all signals, batched, memory-bounded, enriched.
#
# New concepts vs 01:
#   processors  — ordered list applied to every batch inside ONE pipeline
#   memory_limiter — backpressure: sheds load before the OOM killer does
#   batch       — groups items before export; you almost always want it LAST
#                 in the chain (batching after filtering = fewer wasted cycles)
#   attributes/resource — add or rewrite metadata mid-flight
#
# The key mental shift: a pipeline's processors run in DECLARED ORDER, per batch,
# per signal. Traces and logs below get different processors — that is normal;
# pipelines are independent conveyor belts.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400        # hard limit; ~80% of container limit is a sane default
    spike_limit_mib: 100  # soft limit that triggers refusing new data

  resource/defaults:
    attributes:
      - key: deployment.environment
        value: lab
        action: upsert    # insert or overwrite. alternatives: insert, update, delete

  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete    # never ship auth headers downstream

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic      # quieter than 01 so batching is visible, not drowned

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, attributes/scrub, batch]
      exporters: [debug]

  # service-level telemetry about the collector itself (its own metrics)
  telemetry:
    metrics:
      address: 0.0.0.0:8888
